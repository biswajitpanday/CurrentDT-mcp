# Smithery listing: https://smithery.ai/docs/config#smitheryyaml
# A local (stdio) server run straight from npm. No configuration is required;
# CURRENTDT_* environment variables are optional and documented in the README.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction:
    |-
    (config) => ({
      command: "npx",
      args: ["-y", "@strix-ai/currentdt-mcp"]
    })
  exampleConfig: {}
